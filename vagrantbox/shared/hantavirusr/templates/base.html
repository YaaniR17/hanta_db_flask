<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home Page{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}?v=1.1">
</head>
<body>
    <header>
        <center><h1>Hantavirus Patient Database</h1></center>
    </header>
    <nav>
      <ul>
       {% if g.user %}
           <li><span class="user-profile-text">{{ g.user['username'] }}</span></li>
           <li><a href="{{ url_for('home') }}">Home</a></li>
           <a class="nav-btn" href="{{ url_for('patients.index') }}">Patients</a>
           <li><a href="{{ url_for('auth.logout') }}">Log Out</a></li>
       {% else %}
       
           <li><a href="{{ url_for('home') }}">Home</a></li>
           <li><a href="{{ url_for('auth.register') }}">Register</a></li>
           <li><a href="{{ url_for('auth.login') }}">Login</a></li>
       {% endif %}
      </ul>
    </nav>
    {% block header %}{% endblock %}
    {% block content %}{% endblock %}
</body>
</html>
