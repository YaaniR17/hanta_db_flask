{% block header %}
  <h1>{% block title %}New Patient Entry{% endblock %}</h1>
{% block endblock %}

{% block content %}
  <form method="post" class="patient-form">
    
    <!-- Names -->
    <label for="firstname">First Name</label>
    <input name="firstname" id="firstname" value="{{ request.form['firstname'] or '' }}" required>

    <label for="lastname">Last Name</label>
    <input name="lastname" id="lastname" value="{{ request.form['lastname'] or '' }}" required>

    <!-- Age and Admission -->
    <label for="age">Age</label>
    <input type="number" name="age" id="age" value="{{ request.form['age'] or '' }}">

    <label for="date_of_admission">Date of Admission</label>
    <input type="date" name="date_of_admission" id="date_of_admission" value="{{ request.form['date_of_admission'] or '' }}" required>

    <!-- Clinical Details -->
    <label for="infection_status">Infection Status</label>
    <select name="infection_status" id="infection_status">
        <option value="Suspected" {% if request.form['infection_status'] == 'Suspected' %}selected{% endif %}>Suspected Case</option>
        <option value="Confirmed" {% if request.form['infection_status'] == 'Confirmed' %}selected{% endif %}>Confirmed Case</option>
        <option value="Recovered" {% if request.form['infection_status'] == 'Recovered' %}selected{% endif %}>Recovered / Discharged</option>
    </select>

    <input type="submit" value="Save Patient Record">
  </form>
{% block endblock %}
